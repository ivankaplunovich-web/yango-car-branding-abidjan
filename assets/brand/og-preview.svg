<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#backgroundGlow)"/>
  <circle cx="1008" cy="92" r="240" fill="#FF0000" fill-opacity="0.14"/>
  <circle cx="110" cy="526" r="190" fill="#FF0000" fill-opacity="0.10"/>

  <g opacity="0.9">
    <circle cx="82" cy="78" r="24" fill="#FF0000"/>
    <circle cx="82" cy="78" r="38" stroke="#FF0000" stroke-opacity="0.18" stroke-width="14"/>
    <text x="132" y="91" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
      Yango Car Branding
    </text>
  </g>

  <text x="72" y="188" fill="#FF0000" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">
    ABIDJAN MOVING MEDIA
  </text>
  <text x="72" y="292" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800">
    Own the
  </text>
  <text x="72" y="386" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800">
    city streets.
  </text>
  <text x="76" y="462" fill="#D8D8D8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">
    Citywide car branding in Abidjan.
  </text>

  <g transform="translate(76 512)">
    <rect x="0" y="0" width="166" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="24" y="32" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Full-city reach</text>
    <rect x="184" y="0" width="152" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="208" y="32" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Lower CPM</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="570" y="94" width="554" height="408" rx="34" fill="#F7F5F0"/>
    <rect x="570" y="94" width="554" height="408" rx="34" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
    <clipPath id="carCrop">
      <rect x="588" y="112" width="518" height="372" rx="26"/>
    </clipPath>
    <g clip-path="url(#carCrop)">
      <rect x="588" y="112" width="518" height="372" fill="#F8F6F1"/>
      <image href="../branding-options/comfort-4-doors-back-window.png" x="520" y="118" width="690" height="388" preserveAspectRatio="xMidYMid slice"/>
      <rect x="588" y="112" width="518" height="372" fill="url(#photoFade)"/>
    </g>
  </g>

  <rect x="604" y="450" width="286" height="42" rx="21" fill="#0A0A0A" fill-opacity="0.78"/>
  <text x="628" y="478" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    Abidjan campaign planner
  </text>
  <rect x="908" y="450" width="198" height="42" rx="21" fill="#FF0000"/>
  <text x="932" y="478" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    Request proposal
  </text>

  <defs>
    <linearGradient id="backgroundGlow" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820"/>
      <stop offset="0.52" stop-color="#080808"/>
      <stop offset="1" stop-color="#2A0B0B"/>
    </linearGradient>
    <linearGradient id="photoFade" x1="588" y1="112" x2="1106" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF0000" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="cardShadow" x="520" y="52" width="654" height="508" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
</svg>
